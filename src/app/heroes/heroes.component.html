<!-- 
  ==================================================
  HeroesComponentのテンプレート：ヒーロー情報の表示と編集画面
  ==================================================
  
  このファイルの役割：
  - ヒーロー情報の表示・編集UI
  - heroes.component.tsのデータと連携
  - Angularの様々なデータバインディング機能を使用
  
  使用している主なAngular機能：
  1. 補間（interpolation）: {{}} を使ったデータ表示
  2. パイプ（pipe）: | を使ったデータ変換
  3. 双方向データバインディング: [(ngModel)] を使った入力フィールド
  4. プロパティバインディング: HTML属性への値設定
-->

<!-- 
  ==================================================
  ヒーローの詳細情報ヘッダー部分
  ==================================================
-->
<!-- 
  補間とパイプを組み合わせた表示例：
  - {{hero.name}}：heroes.component.tsのheroオブジェクトのnameプロパティを取得
  - | uppercase：パイプ機能でテキストを大文字に変換
  - "Details"：固定文字列を追加
  
  例：hero.name = "Windstorm" → "WINDSTORM Details" と表示される
-->
<h2>{{hero.name | uppercase}} Details</h2>

<!-- 
  ==================================================
  ヒーロー情報の表示部分
  ==================================================
-->
<!-- 
  ヒーローIDの表示：
  - {{hero.id}}：heroオブジェクトのidプロパティ（number型）を文字列として表示
  - spanタグ：ラベル部分のスタイリング用
-->
<div><span>id: </span>{{hero.id}}</div>

<!-- 
  ヒーロー名の表示：
  - {{hero.name}}：heroオブジェクトのnameプロパティ（string型）を表示
  - 上のh2タグと同じデータだが、パイプ変換なしでそのまま表示
-->
<div><span>name: </span>{{hero.name}}</div>

<!-- 
  ==================================================
  ヒーロー名前の編集フォーム部分
  ==================================================
-->
<div>
  <!-- 
    ラベル要素：
    - for="name"：下のinput要素のid属性と関連付け
    - アクセシビリティ向上（スクリーンリーダー対応など）
    - ラベルクリックでinputにフォーカスが移る
  -->
  <label for="name">Hero name: </label>
  
  <!-- 
    双方向データバインディングの例：
    - [(ngModel)]="hero.name"：バナナインボックス構文
    - [ ]：プロパティバインディング（コンポーネント → ビュー）
    - ( )：イベントバインディング（ビュー → コンポーネント）
    - 組み合わせ：データの双方向同期
    
    動作の仕組み：
    1. ユーザーがinputに文字を入力
    2. 自動的にhero.nameプロパティが更新される
    3. 上のh2とdivの{{hero.name}}表示も即座に更新される
    
    必要な設定：
    - app.module.tsでFormsModuleをimportする必要がある
    - FormsModuleがないと[(ngModel)]は動作しない
    
    その他の属性：
    - id="name"：ラベルとの関連付け用
    - placeholder="name"：入力フィールドのヒントテキスト
  -->
  <input id="name" [(ngModel)]="hero.name" placeholder="name">
</div>
